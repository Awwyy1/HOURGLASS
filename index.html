<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Prevent dark-mode flash on reload -->
    <script>
      (function () {
        var t = localStorage.getItem("hourglass-theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      })();
    </script>

    <!-- Primary SEO -->
    <title>HOURGLASS — Your life in weeks, and where the hours go</title>
    <meta name="description" content="See your whole life on one page, one square for every week, then find out how many days, weeks and waking years a single daily habit takes from it." />
    <meta name="keywords" content="time calculator, life calculator, hours spent, habit tracker, time awareness, how much time, lifetime calculator" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="HOURGLASS" />

    <!-- Canonical: written per page at build time by scripts/prerender.mjs
         and kept in step during navigation by useSocialTags in __root.tsx. -->
    <link rel="canonical" href="https://www.justhourglass.me/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.justhourglass.me/" />
    <meta property="og:title" content="HOURGLASS — Your life in weeks, and where the hours go" />
    <meta property="og:description" content="See your whole life on one page, one square for every week, then find out how many days, weeks and waking years a single daily habit takes from it." />
    <meta property="og:site_name" content="HOURGLASS" />
    <!-- Written per page at build time and swapped during navigation.
         Articles use /og/<slug>.png; this is the fallback card. -->
    <meta property="og:image" content="https://www.justhourglass.me/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HOURGLASS — an editorial calculator for the hours a habit costs over a lifetime." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HOURGLASS — Your life in weeks, and where the hours go" />
    <meta name="twitter:description" content="See your whole life on one page, one square for every week, and where the hours go." />
    <meta name="twitter:image" content="https://www.justhourglass.me/og-default.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Fonts (preconnect first, then load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@200;300;400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
